[package]
name = "gk-pixel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pixel-art rendering for Bevy 3D: low-resolution cameras, depth and normal outlines, palette quantisation."
repository = "https://github.com/Rynvosis/gk-pixel"
keywords = ["bevy", "pixel-art", "shader", "rendering"]
categories = ["game-development", "rendering"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "bevy_sprite", "bevy_sprite_render"] }

[dev-dependencies]
bevy = { version = "0.20.1", features = ["debug"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
nonstandard_macro_braces = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
